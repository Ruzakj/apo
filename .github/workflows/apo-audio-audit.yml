name: APO Audio Audit

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apo-audio-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit audio resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee apo-slim/AUDIO_AUDIT.txt
          import os, zipfile, collections

          apk='apo-4-9-0.apk'
          exts={'.mp3','.wav','.ogg','.m4a','.aac','.opus','.flac','.amr','.3gp','.mid','.midi'}
          rows=[]
          by_ext=collections.Counter()
          total_c=total_r=0

          with zipfile.ZipFile(apk) as z:
              for i in z.infolist():
                  if i.is_dir():
                      continue
                  ext=os.path.splitext(i.filename.lower())[1]
                  if ext in exts or i.filename.startswith('res/raw/'):
                      rows.append((i.compress_size,i.file_size,i.filename,ext or '<none>'))
                      by_ext[ext or '<none>'] += i.compress_size
                      total_c += i.compress_size
                      total_r += i.file_size

          def kib(n): return n/1024
          def mib(n): return n/1024/1024

          print('APO Audio Resource Audit')
          print('========================')
          print(f'Audio/raw entries: {len(rows)}')
          print(f'Total compressed: {total_c} bytes ({mib(total_c):.3f} MiB)')
          print(f'Total raw:        {total_r} bytes ({mib(total_r):.3f} MiB)')
          print('\nBy extension:')
          for ext,size in by_ext.most_common():
              print(f'  {ext:8} {mib(size):8.3f} MiB')
          print('\nFiles (largest first):')
          for c,r,n,e in sorted(rows, reverse=True):
              print(f'  compressed={kib(c):8.2f} KiB  raw={kib(r):8.2f} KiB  {n}')
          PY

      - name: Upload audio audit
        uses: actions/upload-artifact@v4
        with:
          name: APO-Audio-Audit
          path: apo-slim/AUDIO_AUDIT.txt
          retention-days: 14
