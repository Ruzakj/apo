name: APO Stage H Home Compose Background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-stage-h-home-compose-background.yml'
      - 'apo-4-9-0.apk'
      - 'background/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick curl
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Locate Android build-tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          cp "$BT/aapt2" ./aapt2-local
          chmod +x ./aapt2-local
          echo "dir=$BT" >> "$GITHUB_OUTPUT"
          echo "aapt2=$GITHUB_WORKSPACE/aapt2-local" >> "$GITHUB_OUTPUT"

      - name: Prepare background
        shell: bash
        run: |
          set -euo pipefail
          BG="background/file_000000007c6c8206af348f3652a79cd1.png"
          test -f "$BG"
          convert "$BG" -auto-orient -resize '1080x2408^' -gravity center -extent 1080x2408 -strip apo_home_bg.png
          identify apo_home_bg.png

      - name: Decode and patch launcher activity theme
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f apo-4-9-0.apk -o decoded
          mkdir -p decoded/res/drawable-nodpi
          cp apo_home_bg.png decoded/res/drawable-nodpi/apo_home_bg.png
          python3 - <<'PY'
          import os
          from xml.etree import ElementTree as ET
          manifest='decoded/AndroidManifest.xml'
          ANDROID='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ANDROID)
          a='{%s}'%ANDROID
          tree=ET.parse(manifest)
          root=tree.getroot()
          app=root.find('application')
          launcher=None
          for node in app.findall('activity'):
              for f in node.findall('intent-filter'):
                  actions={x.get(a+'name','') for x in f.findall('action')}
                  cats={x.get(a+'name','') for x in f.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      launcher=node
                      break
              if launcher is not None:
                  break
          if launcher is None:
              raise SystemExit('launcher activity not found')
          old_theme=launcher.get(a+'theme') or app.get(a+'theme') or ''
          launcher.set(a+'theme','@style/ApoHomeBackgroundTheme')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          parent_attr=f' parent="{old_theme}"' if old_theme.startswith('@style/') else ''
          os.makedirs('decoded/res/values',exist_ok=True)
          open('decoded/res/values/apo_home_background_theme.xml','w',encoding='utf-8').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'  <style name="ApoHomeBackgroundTheme"{parent_attr}>\n'
              '    <item name="android:windowBackground">@drawable/apo_home_bg</item>\n'
              '    <item name="android:windowIsTranslucent">false</item>\n'
              '    <item name="android:colorBackground">@android:color/transparent</item>\n'
              '  </style>\n</resources>\n')
          open('stage-h-report.txt','w',encoding='utf-8').write(
              f'Launcher activity: {launcher.get(a+"name")}\nOriginal theme: {old_theme}\nBackground: @drawable/apo_home_bg\n')
          PY

      - name: Sanitize generated drawable names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          mapping={}
          for root, dirs, files in os.walk('decoded/res'):
              for fn in files:
                  if '$' in fn:
                      old=os.path.join(root,fn)
                      new=os.path.join(root,fn.replace('$','z_'))
                      if os.path.exists(new):
                          raise SystemExit(f'collision: {new}')
                      mapping[old]=new
          for old,new in mapping.items():
              os.rename(old,new)
          repl={os.path.splitext(os.path.basename(o))[0]:os.path.splitext(os.path.basename(n))[0] for o,n in mapping.items()}
          changed=0
          for root, dirs, files in os.walk('decoded/res'):
              for fn in files:
                  if not fn.endswith('.xml'):
                      continue
                  p=os.path.join(root,fn)
                  txt=open(p,encoding='utf-8',errors='ignore').read()
                  orig=txt
                  for a,b in repl.items():
                      txt=txt.replace('@drawable/'+a,'@drawable/'+b)
                      txt=txt.replace('@mipmap/'+a,'@mipmap/'+b)
                  if txt != orig:
                      open(p,'w',encoding='utf-8').write(txt)
                      changed += 1
          with open('stage-h-report.txt','a',encoding='utf-8') as f:
              f.write(f'Sanitized drawable files: {len(mapping)}\nXML files updated: {changed}\n')
          print(f'sanitized {len(mapping)} drawable files; updated {changed} XML files')
          PY

      - name: Rebuild with local AAPT2 and sign
        env:
          BT: ${{ steps.bt.outputs.dir }}
          AAPT2_LOCAL: ${{ steps.bt.outputs.aapt2 }}
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b -a "$AAPT2_LOCAL" decoded -o APO-Stage-H-home-background-unsigned.apk
          "$BT/zipalign" -f -p 4 APO-Stage-H-home-background-unsigned.apk APO-Stage-H-home-background-aligned.apk
          keytool -genkeypair -keystore apo-stage-h.jks -storepass android -keypass android -alias apoh -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=APO Stage H,O=Ruzakj,C=ID"
          "$BT/apksigner" sign --ks apo-stage-h.jks --ks-key-alias apoh --ks-pass pass:android --key-pass pass:android --out APO-Stage-H-home-background.apk APO-Stage-H-home-background-aligned.apk
          "$BT/apksigner" verify --verbose APO-Stage-H-home-background.apk | tee -a stage-h-report.txt
          stat -c 'APK size: %s bytes' APO-Stage-H-home-background.apk | tee -a stage-h-report.txt
          sha256sum APO-Stage-H-home-background.apk | tee -a stage-h-report.txt

      - name: Upload Stage H
        uses: actions/upload-artifact@v4
        with:
          name: APO-Stage-H-home-compose-background-aapt2
          path: |
            APO-Stage-H-home-background.apk
            stage-h-report.txt
          retention-days: 14
