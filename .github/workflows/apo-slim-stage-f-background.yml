name: APO Slim Stage F Custom Background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-slim-stage-f-background.yml'
      - 'apo-4-9-0.apk'
      - 'background/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg

      - name: Locate Android build-tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BT/aapt"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Resolve custom background and launcher icons
        env:
          BT: ${{ steps.bt.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          BG="background/file_000000007c6c8206af348f3652a79cd1.png"
          test -f "$BG"
          echo "BG=$BG" >> "$GITHUB_ENV"
          "$BT/aapt" dump badging apo-4-9-0.apk | sed -n "s/.*application-icon-[0-9]*:'\([^']*\)'.*/\1/p" | sort -u > launcher-icons.txt || true
          "$BT/aapt" dump badging apo-4-9-0.apk | sed -n "s/.*application:.*icon='\([^']*\)'.*/\1/p" | sort -u >> launcher-icons.txt || true
          sort -u launcher-icons.txt -o launcher-icons.txt
          echo 'Launcher resources preserved:'
          cat launcher-icons.txt || true
          identify "$BG"

      - name: Prepare signing key and silent audio
        run: |
          set -euo pipefail
          ffmpeg -loglevel error -f lavfi -i anullsrc=r=8000:cl=mono -t 0.05 -q:a 9 -acodec libmp3lame tiny.mp3 -y
          keytool -genkeypair -keystore apo-slim-test.jks -storepass android -keypass android -alias aposlim -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=APO Slim Test,O=Ruzakj,C=ID"

      - name: Build Stage F custom-background APK
        env:
          BT: ${{ steps.bt.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, os, tempfile, subprocess, shutil

          src='apo-4-9-0.apk'
          dst='APO-Slim-Stage-F-custom-background-unsigned.apk'
          bg=os.environ['BG']
          keep_abi='lib/arm64-v8a/'
          remove_native={'lib/arm64-v8a/libjingle_peerconnection_so.so'}
          launcher=set()
          if os.path.exists('launcher-icons.txt'):
              launcher={x.strip() for x in open('launcher-icons.txt',encoding='utf-8') if x.strip()}

          silent=open('tiny.mp3','rb').read()
          replaced=[]
          removed=[]
          preserved_icons=[]
          barcode=[]

          def make_bg_for(original_bytes, ext, original_name):
              with tempfile.TemporaryDirectory() as td:
                  inp=os.path.join(td,'orig'+ext)
                  out=os.path.join(td,'new'+ext)
                  with open(inp,'wb') as f:
                      f.write(original_bytes)
                  try:
                      dims=subprocess.check_output(['identify','-format','%w %h',inp], text=True).strip().split()
                      w,h=map(int,dims[:2])
                      # Center-crop to the exact original resource dimensions. This preserves
                      # the source photo aspect ratio and never stretches the people/image.
                      subprocess.check_call([
                          'convert', bg,
                          '-auto-orient',
                          '-resize', f'{w}x{h}^',
                          '-gravity','center',
                          '-extent',f'{w}x{h}',
                          '-strip',
                          out
                      ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      return open(out,'rb').read(), (w,h)
                  except Exception:
                      return original_bytes, None

          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w',allowZip64=True) as zout:
              for i in zin.infolist():
                  if i.is_dir():
                      continue
                  n=i.filename
                  low=n.lower()

                  if n.startswith('lib/') and not n.startswith(keep_abi):
                      removed.append((n,i.file_size,'non-arm64'))
                      continue
                  if n in remove_native:
                      removed.append((n,i.file_size,'webrtc'))
                      continue
                  if low.startswith('meta-inf/') and low.endswith(('.rsa','.dsa','.ec','.sf')):
                      removed.append((n,i.file_size,'old-signature'))
                      continue

                  if 'barhopper' in low or 'barcode' in low or 'mlkit_barcode_models' in low:
                      barcode.append((n,i.file_size))

                  data=zin.read(n)
                  ext=os.path.splitext(low)[1]

                  if n in launcher:
                      preserved_icons.append((n,i.file_size))
                  elif n.startswith('res/') and ext in ('.webp','.png','.jpg','.jpeg') and i.file_size >= 24*1024:
                      newdata,dims=make_bg_for(data,ext,n)
                      if dims is not None:
                          replaced.append((n,i.file_size,len(newdata),dims))
                          data=newdata
                  elif ext == '.mp3':
                      old=i.file_size
                      data=silent
                      replaced.append((n,old,len(data),('audio','silent')))

                  ni=zipfile.ZipInfo(n, i.date_time)
                  ni.compress_type=i.compress_type
                  ni.comment=i.comment
                  ni.extra=i.extra
                  ni.internal_attr=i.internal_attr
                  ni.external_attr=i.external_attr
                  ni.create_system=i.create_system
                  ni.flag_bits=i.flag_bits
                  zout.writestr(ni,data)

          with open('APO-Slim-Stage-F-report.txt','w') as f:
              f.write('APO Slim Stage F Custom Background\n')
              f.write('==================================\n')
              f.write(f'Background source: {bg}\n')
              f.write(f'Background/replaced entries: {len(replaced)}\n')
              f.write(f'Removed entries: {len(removed)}\n')
              f.write(f'Launcher/icon entries preserved: {len(preserved_icons)}\n\n')
              f.write('PRESERVED LAUNCHER ICONS:\n')
              for n,s in preserved_icons:
                  f.write(f'{s:12d} {n}\n')
              f.write('\nBARCODE RESOURCES PRESERVED:\n')
              for n,s in barcode:
                  f.write(f'{s:12d} {n}\n')
              f.write('\nBACKGROUND REPLACEMENTS:\n')
              for n,old,new,dims in sorted(replaced,key=lambda x:x[1],reverse=True):
                  f.write(f'{old:12d} -> {new:12d} {dims!s:18} {n}\n')
          PY

          "$BT/zipalign" -f -p 4 APO-Slim-Stage-F-custom-background-unsigned.apk APO-Slim-Stage-F-custom-background-aligned.apk
          "$BT/apksigner" sign --ks apo-slim-test.jks --ks-key-alias aposlim --ks-pass pass:android --key-pass pass:android --out APO-Slim-Stage-F-custom-background.apk APO-Slim-Stage-F-custom-background-aligned.apk
          "$BT/apksigner" verify --verbose APO-Slim-Stage-F-custom-background.apk

      - name: Report
        run: |
          stat -c 'Baseline: %s bytes' apo-4-9-0.apk | tee -a APO-Slim-Stage-F-report.txt
          stat -c 'Stage F: %s bytes' APO-Slim-Stage-F-custom-background.apk | tee -a APO-Slim-Stage-F-report.txt
          sha256sum APO-Slim-Stage-F-custom-background.apk | tee -a APO-Slim-Stage-F-report.txt
          head -n 220 APO-Slim-Stage-F-report.txt

      - name: Upload Stage F
        uses: actions/upload-artifact@v4
        with:
          name: APO-Slim-Stage-F-custom-background
          path: |
            APO-Slim-Stage-F-custom-background.apk
            APO-Slim-Stage-F-report.txt
          retention-days: 14
