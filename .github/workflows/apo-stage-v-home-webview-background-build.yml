name: APO Stage V REAL Home WebView Background Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-stage-v-home-webview-background-build.yml'
      - 'apo-4-9-0.apk'
      - 'background/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick curl
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Locate Android build-tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          cp "$BT/aapt2" ./aapt2-local
          chmod +x ./aapt2-local
          echo "dir=$BT" >> "$GITHUB_OUTPUT"
          echo "aapt2=$GITHUB_WORKSPACE/aapt2-local" >> "$GITHUB_OUTPUT"

      - name: Prepare background without stretching
        run: |
          set -euo pipefail
          BG="background/file_000000007c6c8206af348f3652a79cd1.png"
          test -f "$BG"
          convert "$BG" -auto-orient -resize '1080x2408^' -gravity center -extent 1080x2408 -strip apo_home_bg.png
          identify apo_home_bg.png | tee stage-v-report.txt

      - name: Decode APK
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f apo-4-9-0.apk -o decoded

      - name: Patch exact Home WebView
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decoded/res/drawable-nodpi decoded/smali/com/ric/apopatch
          cp apo_home_bg.png decoded/res/drawable-nodpi/apo_home_bg.png

          cat > decoded/smali/com/ric/apopatch/HomeBackgroundInjector.smali <<'SMALI'
          .class public final Lcom/ric/apopatch/HomeBackgroundInjector;
          .super Ljava/lang/Object;
          .implements Ljava/lang/Runnable;

          .field private final webView:Landroid/webkit/WebView;
          .field private remaining:I

          .method private constructor <init>(Landroid/webkit/WebView;)V
              .locals 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              iput-object p1, p0, Lcom/ric/apopatch/HomeBackgroundInjector;->webView:Landroid/webkit/WebView;
              const/16 v0, 0x18
              iput v0, p0, Lcom/ric/apopatch/HomeBackgroundInjector;->remaining:I
              return-void
          .end method

          .method public static apply(Landroid/webkit/WebView;)V
              .locals 4
              if-eqz p0, :done
              const/4 v0, 0x0
              invoke-virtual {p0, v0}, Landroid/webkit/WebView;->setBackgroundColor(I)V
              new-instance v0, Lcom/ric/apopatch/HomeBackgroundInjector;
              invoke-direct {v0, p0}, Lcom/ric/apopatch/HomeBackgroundInjector;-><init>(Landroid/webkit/WebView;)V
              const-wide/16 v1, 0x96
              invoke-virtual {p0, v0, v1, v2}, Landroid/webkit/WebView;->postDelayed(Ljava/lang/Runnable;J)Z
              pop
          :done
              return-void
          .end method

          .method public final run()V
              .locals 5
              iget-object v0, p0, Lcom/ric/apopatch/HomeBackgroundInjector;->webView:Landroid/webkit/WebView;
              if-eqz v0, :done
              const/4 v1, 0x0
              invoke-virtual {v0, v1}, Landroid/webkit/WebView;->setBackgroundColor(I)V
              const-string v1, "javascript:(function(){try{function a(){var b=document.body;if(!b)return;document.documentElement.style.setProperty('background-color','transparent','important');b.style.setProperty('background-color','transparent','important');b.style.setProperty('background-image','url(file:///android_res/drawable/apo_home_bg.png)','important');b.style.setProperty('background-size','cover','important');b.style.setProperty('background-position','center center','important');b.style.setProperty('background-repeat','no-repeat','important');b.style.setProperty('background-attachment','fixed','important');['#root','#app','main','body>div:first-child'].forEach(function(s){var e=document.querySelector(s);if(e){e.style.setProperty('background-color','transparent','important');e.style.setProperty('background-image','none','important');}});}a();if(!window.__apoBgObs&&document.body){window.__apoBgObs=new MutationObserver(a);window.__apoBgObs.observe(document.body,{childList:true,subtree:true});}}catch(e){}})();"
              const/4 v2, 0x0
              invoke-virtual {v0, v1, v2}, Landroid/webkit/WebView;->evaluateJavascript(Ljava/lang/String;Landroid/webkit/ValueCallback;)V
              iget v1, p0, Lcom/ric/apopatch/HomeBackgroundInjector;->remaining:I
              add-int/lit8 v1, v1, -0x1
              iput v1, p0, Lcom/ric/apopatch/HomeBackgroundInjector;->remaining:I
              if-lez v1, :done
              const-wide/16 v2, 0x1f4
              invoke-virtual {v0, p0, v2, v3}, Landroid/webkit/WebView;->postDelayed(Ljava/lang/Runnable;J)Z
              pop
          :done
              return-void
          .end method
          SMALI

          python3 - <<'PY'
          import os,re
          candidates=[]
          for base in ('decoded/smali','decoded/smali_classes2','decoded/smali_classes3'):
              p=os.path.join(base,'il','ze.smali')
              if os.path.isfile(p): candidates.append(p)
          if len(candidates)!=1:
              raise SystemExit(f'expected one il/ze.smali, got {candidates}')
          p=candidates[0]
          lines=open(p,encoding='utf-8').read().splitlines()

          # Only patch method c(... WebView Home implementation ...). Find the unique
          # WebView check-cast inside that method and inject one static helper call.
          method_start=None; method_end=None
          sig='.method public static final c(Lvc/r;Landroid/content/Context;Lcom/alfamart/apo/data/model/AuthDataPayloadResponseModel;Ljava/lang/String;Lcom/alfamart/apo/presentation/main/MainActivity;Ly6/b0;Li2/r;I)V'
          for i,l in enumerate(lines):
              if l.strip()==sig:
                  method_start=i; break
          if method_start is None:
              raise SystemExit('exact il/ze Home c() signature not found')
          for i in range(method_start+1,len(lines)):
              if lines[i].strip()=='.end method': method_end=i; break
          block=lines[method_start:method_end+1]
          hits=[]
          for j,l in enumerate(block):
              m=re.search(r'^\s*check-cast\s+([vp]\d+),\s+Landroid/webkit/WebView;',l)
              if m: hits.append((j,m.group(1)))
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one WebView cast in Home c(), got {hits}')
          rel,reg=hits[0]
          insert_at=method_start+rel+1
          call=f'    invoke-static {{{reg}}}, Lcom/ric/apopatch/HomeBackgroundInjector;->apply(Landroid/webkit/WebView;)V'
          if any('HomeBackgroundInjector;->apply' in l for l in block):
              raise SystemExit('Home injector already present unexpectedly')
          lines.insert(insert_at,call)
          open(p,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          with open('stage-v-report.txt','a') as f:
              f.write(f'Patched exact Home implementation: {p}\n')
              f.write(f'Injected after Home WebView cast register: {reg}\n')
              f.write('Strategy: Home-only WebView transparent + DOM background image + MutationObserver\n')
          PY

      - name: Sanitize apktool dollar resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          mapping={}
          for root,_,files in os.walk('decoded/res'):
              for fn in files:
                  if '$' in fn:
                      old=os.path.join(root,fn); new=os.path.join(root,fn.replace('$','z_'))
                      if os.path.exists(new): raise SystemExit(f'collision: {new}')
                      mapping[old]=new
          for old,new in mapping.items(): os.rename(old,new)
          repl={os.path.splitext(os.path.basename(o))[0]:os.path.splitext(os.path.basename(n))[0] for o,n in mapping.items()}
          changed=0
          for root,_,files in os.walk('decoded/res'):
              for fn in files:
                  if not fn.endswith('.xml'): continue
                  p=os.path.join(root,fn)
                  txt=open(p,encoding='utf-8',errors='ignore').read(); orig=txt
                  for old,new in repl.items(): txt=txt.replace(old,new)
                  if txt!=orig:
                      open(p,'w',encoding='utf-8').write(txt); changed+=1
          with open('stage-v-report.txt','a') as f:
              f.write(f'Sanitized dollar resources: {len(mapping)}; XML updated: {changed}\n')
          PY

      - name: Rebuild align sign
        env:
          BT: ${{ steps.bt.outputs.dir }}
          AAPT2_LOCAL: ${{ steps.bt.outputs.aapt2 }}
        run: |
          set -euo pipefail
          java -jar apktool.jar b -a "$AAPT2_LOCAL" decoded -o APO-Stage-V-home-background-unsigned.apk
          "$BT/zipalign" -f -p 4 APO-Stage-V-home-background-unsigned.apk APO-Stage-V-home-background-aligned.apk
          keytool -genkeypair -keystore apo-stage-v.jks -storepass android -keypass android -alias apov -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=APO Stage V,O=Ruzakj,C=ID"
          "$BT/apksigner" sign --ks apo-stage-v.jks --ks-key-alias apov --ks-pass pass:android --key-pass pass:android --out APO-Stage-V-REAL-HOME-BACKGROUND.apk APO-Stage-V-home-background-aligned.apk
          "$BT/apksigner" verify --verbose APO-Stage-V-REAL-HOME-BACKGROUND.apk | tee -a stage-v-report.txt
          stat -c 'APK size: %s bytes' APO-Stage-V-REAL-HOME-BACKGROUND.apk | tee -a stage-v-report.txt
          sha256sum APO-Stage-V-REAL-HOME-BACKGROUND.apk | tee -a stage-v-report.txt

      - name: Verify final APK contains exact Home patch
        run: |
          set -euo pipefail
          rm -rf verify
          java -jar apktool.jar d -f APO-Stage-V-REAL-HOME-BACKGROUND.apk -o verify >/tmp/verify.log 2>&1
          test -f verify/res/drawable-nodpi/apo_home_bg.png
          test -f verify/smali/com/ric/apopatch/HomeBackgroundInjector.smali
          grep -R -q 'HomeBackgroundInjector;->apply(Landroid/webkit/WebView;)V' verify/smali*/il/ze.smali
          grep -q 'MutationObserver' verify/smali/com/ric/apopatch/HomeBackgroundInjector.smali
          grep -q 'file:///android_res/drawable/apo_home_bg.png' verify/smali/com/ric/apopatch/HomeBackgroundInjector.smali
          echo 'FINAL VERIFY: PASS - exact Home WebView contains custom background injector' | tee -a stage-v-report.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APO-Stage-V-REAL-HOME-BACKGROUND
          path: |
            APO-Stage-V-REAL-HOME-BACKGROUND.apk
            stage-v-report.txt
          retention-days: 14
