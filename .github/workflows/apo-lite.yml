name: Build APO Lite

on:
  push:
    branches: [ main ]
    paths:
      - 'apo-lite/**'
      - '.github/workflows/apo-lite.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: apo-lite
        run: gradle --no-daemon :app:assembleDebug

      - name: Report size
        run: |
          ls -lh apo-lite/app/build/outputs/apk/debug/app-debug.apk
          du -h apo-lite/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apo-lite/app/build/outputs/apk/debug/app-debug.apk > APO-Lite-debug.apk.sha256
          cp apo-lite/app/build/outputs/apk/debug/app-debug.apk APO-Lite-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APO-Lite-debug
          path: |
            APO-Lite-debug.apk
            APO-Lite-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
