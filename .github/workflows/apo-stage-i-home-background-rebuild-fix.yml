name: APO Stage I Home Background Rebuild Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-stage-i-home-background-rebuild-fix.yml'
      - 'apo-4-9-0.apk'
      - 'background/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool imagemagick

      - name: Locate Android build-tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Prepare background
        shell: bash
        run: |
          set -euo pipefail
          BG="background/file_000000007c6c8206af348f3652a79cd1.png"
          test -f "$BG"
          convert "$BG" -auto-orient -resize '1080x2408^' -gravity center -extent 1080x2408 -strip apo_home_bg.png
          identify apo_home_bg.png

      - name: Decode and apply Home host background theme
        shell: bash
        run: |
          set -euo pipefail
          apktool d -f apo-4-9-0.apk -o decoded
          mkdir -p decoded/res/drawable-nodpi
          cp apo_home_bg.png decoded/res/drawable-nodpi/apo_home_bg.png

          python3 - <<'PY'
          import os
          from xml.etree import ElementTree as ET
          manifest='decoded/AndroidManifest.xml'
          ANDROID='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ANDROID)
          a='{%s}'%ANDROID
          tree=ET.parse(manifest)
          root=tree.getroot(); app=root.find('application')
          launcher=None
          for tag in ('activity','activity-alias'):
              for node in app.findall(tag):
                  for f in node.findall('intent-filter'):
                      actions={x.get(a+'name','') for x in f.findall('action')}
                      cats={x.get(a+'name','') for x in f.findall('category')}
                      if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                          launcher=node; break
                  if launcher is not None: break
              if launcher is not None: break
          if launcher is None: raise SystemExit('launcher not found')
          old_theme=launcher.get(a+'theme') or app.get(a+'theme') or ''
          launcher.set(a+'theme','@style/ApoHomeBackgroundTheme')
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          os.makedirs('decoded/res/values',exist_ok=True)
          parent = f' parent="{old_theme}"' if old_theme.startswith('@style/') else ''
          open('decoded/res/values/apo_home_background_theme.xml','w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'  <style name="ApoHomeBackgroundTheme"{parent}>\n'
              '    <item name="android:windowBackground">@drawable/apo_home_bg</item>\n'
              '    <item name="android:windowIsTranslucent">false</item>\n'
              '    <item name="android:colorBackground">@android:color/transparent</item>\n'
              '  </style>\n</resources>\n')
          open('stage-i-report.txt','w').write(f'Launcher: {launcher.get(a+"name")}\nOld theme: {old_theme}\n')
          PY

      - name: Sanitize apktool generated resource names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          roots=[]
          for root,dirs,files in os.walk('decoded/res'):
              for fn in files:
                  if '$' in fn:
                      roots.append(os.path.join(root,fn))

          mapping={}
          for old in roots:
              d=os.path.dirname(old); fn=os.path.basename(old)
              newfn=fn.replace('$','z_')
              new=os.path.join(d,newfn)
              if os.path.exists(new):
                  raise SystemExit(f'collision: {new}')
              mapping[old]=new

          # rename first
          for old,new in mapping.items():
              os.rename(old,new)

          # update XML references to generated drawable names
          repl={}
          for old,new in mapping.items():
              oldbase=os.path.splitext(os.path.basename(old))[0]
              newbase=os.path.splitext(os.path.basename(new))[0]
              repl[oldbase]=newbase

          changed=0
          for root,dirs,files in os.walk('decoded/res'):
              for fn in files:
                  if not fn.endswith('.xml'): continue
                  p=os.path.join(root,fn)
                  try: txt=open(p,encoding='utf-8').read()
                  except: continue
                  orig=txt
                  for a,b in repl.items():
                      txt=txt.replace('@drawable/'+a,'@drawable/'+b)
                      txt=txt.replace('@mipmap/'+a,'@mipmap/'+b)
                  if txt!=orig:
                      open(p,'w',encoding='utf-8').write(txt); changed+=1

          with open('stage-i-report.txt','a') as f:
              f.write(f'Sanitized generated resource files: {len(mapping)}\n')
              f.write(f'XML files updated: {changed}\n')
              for old,new in sorted(mapping.items())[:200]:
                  f.write(f'{old} -> {new}\n')
          print(f'sanitized {len(mapping)} generated resource names; changed {changed} XML files')
          PY

      - name: Rebuild, align and sign
        env:
          BT: ${{ steps.bt.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          apktool b decoded -o APO-Stage-I-home-background-unsigned.apk
          "$BT/zipalign" -f -p 4 APO-Stage-I-home-background-unsigned.apk APO-Stage-I-home-background-aligned.apk
          keytool -genkeypair -keystore apo-stage-i.jks -storepass android -keypass android -alias apoi -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=APO Stage I,O=Ruzakj,C=ID"
          "$BT/apksigner" sign --ks apo-stage-i.jks --ks-key-alias apoi --ks-pass pass:android --key-pass pass:android --out APO-Stage-I-home-background.apk APO-Stage-I-home-background-aligned.apk
          "$BT/apksigner" verify --verbose APO-Stage-I-home-background.apk | tee -a stage-i-report.txt
          stat -c 'APK size: %s bytes' APO-Stage-I-home-background.apk | tee -a stage-i-report.txt
          sha256sum APO-Stage-I-home-background.apk | tee -a stage-i-report.txt

      - name: Upload Stage I
        uses: actions/upload-artifact@v4
        with:
          name: APO-Stage-I-home-background
          path: |
            APO-Stage-I-home-background.apk
            stage-i-report.txt
          retention-days: 14
