name: APO Slim Stage E Install Safe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-slim-stage-e.yml'
      - 'apo-4-9-0.apk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg

      - name: Locate Android build-tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Prepare tiny resources and test key
        shell: bash
        run: |
          set -euo pipefail
          convert -size 1x1 xc:none tiny.webp
          convert -size 1x1 xc:none tiny.png
          convert -size 1x1 xc:white tiny.jpg
          ffmpeg -loglevel error -f lavfi -i anullsrc=r=8000:cl=mono -t 0.05 -q:a 9 -acodec libmp3lame tiny.mp3 -y
          keytool -genkeypair -keystore apo-slim-test.jks -storepass android -keypass android -alias aposlim -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=APO Slim Test,O=Ruzakj,C=ID"

      - name: Build Stage E install-safe
        env:
          BT: ${{ steps.bt.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, os
          src='apo-4-9-0.apk'
          dst='APO-Slim-Stage-E-install-safe-unsigned.apk'
          keep_abi='lib/arm64-v8a/'
          remove_native={'lib/arm64-v8a/libjingle_peerconnection_so.so'}
          tiny={
              '.webp': open('tiny.webp','rb').read(),
              '.png': open('tiny.png','rb').read(),
              '.jpg': open('tiny.jpg','rb').read(),
              '.jpeg': open('tiny.jpg','rb').read(),
              '.mp3': open('tiny.mp3','rb').read(),
          }
          replaced=[]
          removed=[]
          kept=[]
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w',allowZip64=True) as zout:
              for i in zin.infolist():
                  if i.is_dir():
                      continue
                  n=i.filename
                  low=n.lower()
                  if n.startswith('lib/') and not n.startswith(keep_abi):
                      removed.append((n,i.file_size,'non-arm64'))
                      continue
                  if n in remove_native:
                      removed.append((n,i.file_size,'webrtc'))
                      continue
                  if low.startswith('meta-inf/') and low.endswith(('.rsa','.dsa','.ec','.sf')):
                      removed.append((n,i.file_size,'old-signature'))
                      continue

                  data=zin.read(n)
                  ext=os.path.splitext(low)[1]

                  # Installer-safe rule: preserve every small raster/icon exactly as original.
                  # Only neutralize large decorative images >= 24 KiB (same safe boundary as Stage D).
                  if n.startswith('res/') and ext in ('.webp','.png','.jpg','.jpeg'):
                      if i.file_size >= 24*1024:
                          old=i.file_size
                          data=tiny[ext]
                          replaced.append((n,old,len(data),'large-raster'))
                      else:
                          kept.append((n,i.file_size))
                  elif ext == '.mp3':
                      old=i.file_size
                      data=tiny['.mp3']
                      replaced.append((n,old,len(data),'audio-silent'))

                  ni=zipfile.ZipInfo(n, i.date_time)
                  ni.compress_type=i.compress_type
                  ni.comment=i.comment
                  ni.extra=i.extra
                  ni.internal_attr=i.internal_attr
                  ni.external_attr=i.external_attr
                  ni.create_system=i.create_system
                  ni.flag_bits=i.flag_bits
                  zout.writestr(ni,data)

          with open('APO-Slim-Stage-E-report.txt','w') as f:
              f.write('APO Slim Stage E Install Safe\n')
              f.write('=============================\n')
              f.write(f'Replaced entries: {len(replaced)}\n')
              f.write(f'Removed entries: {len(removed)}\n')
              f.write(f'Preserved small raster/icon entries: {len(kept)}\n')
              f.write(f'Neutralized raw bytes: {sum(x[1] for x in replaced)}\n')
              f.write(f'Removed raw bytes: {sum(x[1] for x in removed)}\n')
          PY

          "$BT/zipalign" -f -p 4 APO-Slim-Stage-E-install-safe-unsigned.apk APO-Slim-Stage-E-install-safe-aligned.apk
          "$BT/apksigner" sign --ks apo-slim-test.jks --ks-key-alias aposlim --ks-pass pass:android --key-pass pass:android --out APO-Slim-Stage-E-install-safe.apk APO-Slim-Stage-E-install-safe-aligned.apk
          "$BT/apksigner" verify --verbose APO-Slim-Stage-E-install-safe.apk

      - name: Report sizes
        run: |
          stat -c 'Baseline: %s bytes' apo-4-9-0.apk | tee -a APO-Slim-Stage-E-report.txt
          stat -c 'Stage E: %s bytes' APO-Slim-Stage-E-install-safe.apk | tee -a APO-Slim-Stage-E-report.txt
          sha256sum APO-Slim-Stage-E-install-safe.apk | tee -a APO-Slim-Stage-E-report.txt

      - name: Upload Stage E
        uses: actions/upload-artifact@v4
        with:
          name: APO-Slim-Stage-E-install-safe
          path: |
            APO-Slim-Stage-E-install-safe.apk
            APO-Slim-Stage-E-report.txt
          retention-days: 14
