name: APO Stage U Home WebView Source Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-stage-u-webview-source-audit.yml'
      - 'apo-4-9-0.apk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip
          curl -fL https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
      - name: Export Home WebView implementation
        run: |
          set -euo pipefail
          rm -rf jadx-out webview-src
          ./jadx/bin/jadx -d jadx-out --show-bad-code apo-4-9-0.apk >/tmp/jadx.log 2>&1 || true
          mkdir -p webview-src
          for f in jadx-out/sources/j1/q.java jadx-out/sources/il/af.java jadx-out/sources/il/ze.java; do
            if [ -f "$f" ]; then cp "$f" webview-src/$(basename $(dirname "$f"))_$(basename "$f"); fi
          done
          grep -RniE 'setWebViewClient|WebViewClient|onPageFinished|evaluateJavascript|loadUrl\(' jadx-out/sources 2>/dev/null | head -n 1200 > webview-src/webview-hits.txt || true
          awk -F: '/setWebViewClient|onPageFinished/ {print $1}' webview-src/webview-hits.txt | sort -u | head -n 80 > /tmp/paths.txt || true
          while read -r f; do
            [ -f "$f" ] || continue
            dst="webview-src/$(echo "$f" | sed 's#jadx-out/sources/##; s#/#_#g')"
            cp "$f" "$dst"
          done < /tmp/paths.txt
          ls -lh webview-src
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: APO-Stage-U-home-webview-source
          path: |
            webview-src/**
            /tmp/jadx.log
          retention-days: 7
