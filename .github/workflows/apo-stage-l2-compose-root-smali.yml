name: APO Stage L2 Compose Root Smali

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apo-stage-l2-compose-root-smali.yml'
      - 'apo-4-9-0.apk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode Compose root smali
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          apktool d -f -r apo-4-9-0.apk -o decoded
          ROOT=$(find decoded -type f -path '*/fd/b.smali' | head -n1)
          test -n "$ROOT"
          {
            echo "ROOT=$ROOT"
            sed -n '1,2600p' "$ROOT"
            echo
            echo '=== fd package references ==='
            grep -RniE 'MainActivity|invoke-interface|invoke-virtual|invoke-static|new-instance' "$(dirname "$ROOT")" 2>/dev/null | head -n 1600 || true
          } | tee compose-root-smali.txt
      - uses: actions/upload-artifact@v4
        with:
          name: APO-Stage-L2-compose-root-smali
          path: compose-root-smali.txt
          retention-days: 7
